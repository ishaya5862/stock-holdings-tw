#==================================================
# 伺服器
#==================================================
server.port=8080
# session 只用 cookie 傳遞：避免轉址網址後面被加上 ;jsessionid=...（網址醜，且 session 編號會外洩到網址列與紀錄）
server.servlet.session.tracking-modes=cookie
# 錯誤回應不帶程式內部細節（stack trace、例外名稱、錯誤訊息）。
# devtools 在開發模式會把這些預設打開（mvnw spring-boot:run 時就是開發模式），這裡明確關掉，避免洩漏程式結構。
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never

#==================================================
# JSON（App 1.0 API）
# App 不會先檢查輸入（填什麼送什麼），型別不對時一定要回 400，不能讓 Jackson 自動「幫忙」轉換：
# - allow-coercion-of-scalars=false：字串 "1" 不會自動變成數字 1、數字不會自動變成字串
# - accept-float-as-int=false：張數送 1.5 不會被偷偷截成 1
# - write-bigdecimal-as-plain=true：金額不會輸出成 1E+3 這種科學記號
#==================================================
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.generator.write-bigdecimal-as-plain=true

#==================================================
# 時區
# 正式機在海外、主機時區不是台北，但使用者都在台灣 →
# 程式內所有「現在幾點、今天幾號」都用這個時區判斷，不依賴主機設定。
#==================================================
app.zone=Asia/Taipei

#==================================================
# 資料庫（MySQL）
# 用 mvnw spring-boot:run 啟動時，Spring Boot 會依 docker-compose.yml 自動啟動 MySQL 並自動帶入連線資訊，
# 下面的設定是「不透過 Docker Compose 啟動」（例如 java -jar 連到自己的 MySQL）時使用，
# 用環境變數 DB_HOST、DB_PORT、DB_USERNAME、DB_PASSWORD 指定。
# 密碼採「環境變數 + 開發用預設值」：devpass 只是本機開發用的假密碼，正式環境請設定 DB_PASSWORD。
#==================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/stock_holdings
spring.datasource.username=${DB_USERNAME:app}
spring.datasource.password=${DB_PASSWORD:devpass}

# 2.0（第 6 題 C3-6）：等鎖最多 3 秒（MySQL 預設 50 秒）。
# 手機與電腦同時寫同一檔持股時會排隊等鎖；App 2.0 10 秒沒回應就會重送，等太久會讓請求越堆越多。
# 等超過 3 秒 → 回 409「資料正在更新，請稍後再試」。每條連線建立時設定一次（連線池的初始化 SQL）。
spring.datasource.hikari.connection-init-sql=SET SESSION innodb_lock_wait_timeout = 3

# 程式關閉時只「停止」MySQL 容器（不刪除），資料保留在 Docker volume
spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.stop.command=stop

#==================================================
# JPA / Flyway
#==================================================
# 資料表一律由 Flyway（src/main/resources/db/migration）建立；
# Hibernate 只「檢查」Entity 和資料表是否一致，不自動改資料表
spring.jpa.hibernate.ddl-auto=validate
# 關閉 open-in-view，避免在畫面渲染時才偷偷查資料庫
spring.jpa.open-in-view=false
# 需要看 SQL 時再打開
spring.jpa.show-sql=false

#==================================================
# 官方行情（第 3 題）
# 主機部分可用環境變數改掉（路徑和參數不變），例如：
#   TWSE_BASE_URL=http://localhost:9000
#   TPEX_BASE_URL=http://localhost:9000
#==================================================
app.quote.twse-base-url=${TWSE_BASE_URL:https://www.twse.com.tw}
app.quote.tpex-base-url=${TPEX_BASE_URL:https://www.tpex.org.tw}
# 逾時（單次請求）：連線 3 秒 + 讀取 4 秒。
app.quote.connect-timeout=3s
app.quote.read-timeout=4s
# 新增持股時「判斷上市／上櫃」的整體上限：兩邊同時查，本月沒資料還要查上個月（一檔最多 2 次請求），
# 單靠上面的逾時無法保證時間，所以再加整體上限，確保從按下新增到看到結果不超過題目要求的 10 秒
# （也低於 Part B App 2.0 的 10 秒自動重送）
app.quote.lookup-timeout=9s

# 背景排程（定時更新收盤價，清單只讀快取）
app.quote.refresh-enabled=true
# 每一輪結束後隔多久再查下一輪（10 分鐘 → 官方公布後一小時內一定看得到）
app.quote.refresh-interval=10m
# 每一次請求之間至少間隔 6 秒，避免被證交所擋
app.quote.request-gap=6s
# 收盤時間（台北時間）：之後才開始等「今天的收盤價」
app.quote.market-close-time=13:30
# 已存在的持股近兩個月（本月、上月）都沒有成交資料時：先查另一個市場（上櫃轉上市等），
# 再往前多查幾個月找「最後一次成交」（4 → 共查到五個月前），用來分辨長期停止交易；每檔每天最多一次
app.quote.lookback-months=4
# 等不到「今天的收盤價」時何時放棄：這個時間之後，同一檔連續 3 次查到的都還是舊日期，今天就不再查
# （颱風假等臨時休市、當天停止交易的股票；避免一直查到半夜）。
# 不能設太早：官方常在 14:00 之後才公布，太早放棄會違反「公布後一小時內看得到」。
app.quote.stale-give-up-after=16:00

# 休市日行事曆（證交所「市場開休市日期」，題目沒有指定的輔助 API）
# 取得順序：官方 API → 內附檔（resources/holidays/年份.json）→ 都沒有就當「平日都有開盤」，排程照常更新。
# 預設「不跟著」TWSE_BASE_URL：考官把行情換成測試伺服器時，休市日仍查真正的證交所。
# HOLIDAY_API_ENABLED=false：不查官方 API（不對外連線），只用內附檔。
app.quote.holiday-base-url=${HOLIDAY_BASE_URL:https://www.twse.com.tw}
app.quote.holiday-api-enabled=${HOLIDAY_API_ENABLED:true}

#==================================================
# Thymeleaf（預設路徑：classpath:/templates/*.html）
#==================================================
# 開發時關閉快取，改 html 重新整理就看得到
spring.thymeleaf.cache=false
