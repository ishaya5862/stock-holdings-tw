#==================================================
# 伺服器
#==================================================
server.port=8080
# server.servlet.context-path=/

#==================================================
# 資料庫（暫時使用 H2 記憶體資料庫，程式關閉資料就會消失）
# 考試當天換成實際資料庫時，修改下面三行並換掉 pom.xml 的驅動
#==================================================
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=

# MySQL 範例：
# spring.datasource.url=jdbc:mysql://localhost:3306/資料庫名稱?serverTimezone=Asia/Taipei
# spring.datasource.username=root
# spring.datasource.password=請填本機密碼（不要上傳真實密碼）

#==================================================
# JPA
#==================================================
# update：依照 Entity 自動建立 / 更新資料表（開發方便，正式環境不建議）
spring.jpa.hibernate.ddl-auto=update
# 在 console 印出執行的 SQL，方便除錯
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# 關閉 open-in-view，避免在畫面渲染時才偷偷查資料庫
spring.jpa.open-in-view=false

#==================================================
# Thymeleaf（預設路徑：classpath:/templates/*.html）
#==================================================
# 開發時關閉快取，改 html 重新整理就看得到
spring.thymeleaf.cache=false

#==================================================
# 檔案上傳大小限制
#==================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
