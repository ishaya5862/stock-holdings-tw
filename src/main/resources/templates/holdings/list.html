<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('持股清單')}"></head>
<body>
	<nav th:replace="~{fragments/layout :: navbar}"></nav>

	<main class="container py-4">
		<div class="d-flex justify-content-between align-items-center mb-3">
			<h2 class="h4 fw-bold mb-0">持股清單</h2>
			<a class="btn btn-primary" th:href="@{/holdings/new}">
				<i class="bi bi-plus-lg me-1"></i>新增持股
			</a>
		</div>

		<div th:replace="~{fragments/layout :: flash}"></div>

		<p class="small text-muted mb-2">
			<i class="bi bi-info-circle"></i>
			收盤價取自證交所、櫃買中心公布的最近一個交易日，每 10 分鐘在背景自動更新（重新整理頁面即可看到最新結果）。
		</p>

		<div class="card app-card">
			<!-- 沒有持股時的提示 -->
			<div th:if="${#lists.isEmpty(holdings)}" class="card-body text-center text-muted py-5">
				<i class="bi bi-inbox fs-1 d-block mb-2"></i>
				目前沒有持股，按右上角「新增持股」開始記錄。
			</div>

			<div th:unless="${#lists.isEmpty(holdings)}" class="table-responsive">
				<table class="table table-hover align-middle mb-0">
					<thead class="table-light">
						<tr>
							<th>代號</th>
							<th>名稱</th>
							<th>市場</th>
							<th class="text-end">張數</th>
							<th class="text-end">買進價</th>
							<th class="text-end">收盤價</th>
							<th class="text-end">操作</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="h : ${holdings}">
							<td class="fw-semibold app-number" th:text="${h.code}">2330</td>
							<!--/* 名稱、市場：新增時從官方取得；第 2 題時新增的舊資料由背景排程補上，補上前顯示「—」 */-->
							<td th:text="${h.name} ?: '—'">台積電</td>
							<td>
								<span th:if="${h.market}" class="badge text-bg-secondary" th:text="${h.market.label}">上市</span>
								<span th:unless="${h.market}" class="text-muted">—</span>
							</td>
							<td class="text-end app-number" th:text="${#numbers.formatInteger(h.lots, 1, 'COMMA')}">1</td>
							<td class="text-end app-number"
								th:text="${#numbers.formatDecimal(h.buyPrice, 1, 'COMMA', 2, 'POINT')}">1,000.00</td>
							<!--/*
								收盤價：依行情狀態顯示（這種 Thymeleaf 註解不會送到瀏覽器）
								OK          → 收盤價 + 日期
								UPDATING    → 更新中…（這次啟動後還沒輪到查詢）
								UNAVAILABLE → 未取得（官方連不上）
								NOT_FOUND   → 查無此代號
								更新中、未取得時，資料庫有上次收盤價就用小字顯示「上次收盤價 X（日期）」
							*/-->
							<td class="text-end app-number text-nowrap" th:switch="${h.quoteStatus.name()}">
								<th:block th:case="'OK'">
									<span class="fw-semibold"
										th:text="${#numbers.formatDecimal(h.closePrice, 1, 'COMMA', 2, 'POINT')}">1,100.00</span>
									<div class="small text-muted" th:text="${#temporals.format(h.priceDate, 'MM/dd')}">11/19</div>
								</th:block>
								<th:block th:case="'NOT_FOUND'">
									<span class="text-danger">查無此代號</span>
								</th:block>
								<th:block th:case="*">
									<span th:if="${h.quoteStatus.name() == 'UPDATING'}" class="text-secondary">
										<i class="bi bi-arrow-repeat"></i> 更新中…
									</span>
									<span th:unless="${h.quoteStatus.name() == 'UPDATING'}" class="text-warning-emphasis">未取得</span>
									<div class="small text-muted" th:if="${h.hasLastClosePrice()}">
										上次收盤價
										<span th:text="${#numbers.formatDecimal(h.lastClosePrice, 1, 'COMMA', 2, 'POINT')}">1,100.00</span>
										（<span th:text="${#temporals.format(h.lastPriceDate, 'MM/dd')}">11/19</span>）
									</div>
								</th:block>
							</td>
							<td class="text-end text-nowrap">
								<a class="btn btn-sm btn-outline-secondary" th:href="@{/holdings/{id}/edit(id=${h.id})}">
									<i class="bi bi-pencil"></i> 修改
								</a>
								<!-- 刪除用 POST 表單（不用 GET 連結，避免被瀏覽器預先載入或爬蟲誤刪），送出前先確認 -->
								<form class="d-inline" method="post" th:action="@{/holdings/{id}/delete(id=${h.id})}"
									th:data-code="${h.code}"
									onsubmit="return confirm('確定要刪除 ' + this.dataset.code + ' 嗎？');">
									<button type="submit" class="btn btn-sm btn-outline-danger">
										<i class="bi bi-trash"></i> 刪除
									</button>
								</form>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</main>

	<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
