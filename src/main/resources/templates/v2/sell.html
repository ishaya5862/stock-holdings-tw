<!DOCTYPE html>
<!--
	持股記帳 2.0：賣出頁（第 6 題 C9；版面依 2026-11-20 預覽版 v2-sell.html）。
	- 從持股列點「賣出」→ /v2/sell?code=2330（只能賣目前持有的，代號不能改；0 股或資料異常由伺服器擋回總覽）
	- 股數可用「股」或「張」填，送出的 JSON 一律是股數（shares）
	- 「不能賣超」打字當下就提示，真正的把關在後端：送出時伺服器鎖住持股、用最新的交易紀錄重算。
	  手機（App 2.0）可能在這一頁打開之後先賣掉一部分 → 伺服器回 OVERSELL，這一頁重新讀取持有股數。
	- 送出：POST /api/v2/holdings/{code}/trades（side = SELL），標頭帶 Idempotency-Key
-->
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{v2/fragments :: head('賣出 ' + ${holding.code})}"></head>
<body>
	<nav th:replace="~{v2/fragments :: navbar('form')}"></nav>

	<main class="container v2-form-page py-4">
		<a th:href="@{/v2}" class="small text-decoration-none"><i class="bi bi-arrow-left"></i> 回持股總覽</a>
		<h1 class="h4 mt-2 mb-3 v2-page-title v2-sell">
			賣出 <span th:text="${holding.code}">2330</span> <span th:text="${holding.name}">台積電</span>
		</h1>

		<div id="form-alert" class="d-none" role="alert"></div>
		<noscript><div class="alert alert-danger">這一頁需要啟用 JavaScript 才能送出。</div></noscript>

		<div class="row g-4">
			<div class="col-12 col-lg-8">
				<!-- 目前持有（只顯示）：灰底；被另一個裝置改過時會重新讀取 -->
				<div class="v2-info mb-3 d-flex align-items-center">
					<div class="me-4">持有 <strong class="fs-5" id="held-shares"></strong> 股</div>
					<div class="me-4">平均成本 <strong id="held-avg"></strong> 元</div>
					<div class="ms-auto small text-secondary" id="held-time"></div>
				</div>

				<div class="v2-section">
					<div class="v2-submit-overlay d-none" role="status" aria-live="polite">
						<div class="spinner-border mb-2"></div>
						<div>送出中，請稍候…</div>
						<div class="small text-secondary">請勿關閉或重新整理頁面</div>
					</div>
					<form id="sell-form" class="p-4" novalidate>
						<div class="row g-3 mb-3">
							<div class="col-12 col-md-3">
								<label for="date" class="form-label">賣出日期</label>
								<input id="date" type="date" class="form-control">
								<div id="date-feedback" class="invalid-feedback"></div>
								<div id="date-warning" class="form-text"></div>
							</div>
							<div class="col-12 col-md-5">
								<label for="quantity" class="form-label d-flex">
									<span class="me-auto">數量</span>
									<a href="#" id="sell-all" class="small text-decoration-none">全部賣出</a>
								</label>
								<div class="input-group has-validation">
									<input id="quantity" class="form-control text-end" inputmode="decimal" autocomplete="off">
									<input type="radio" class="btn-check" name="unit" id="unit-share" value="share" checked>
									<label class="btn btn-outline-secondary" for="unit-share">股</label>
									<input type="radio" class="btn-check" name="unit" id="unit-lot" value="lot">
									<label class="btn btn-outline-secondary" for="unit-lot">張</label>
									<div id="quantity-feedback" class="invalid-feedback"></div>
								</div>
								<div id="quantity-hint" class="form-text"></div>
							</div>
							<div class="col-12 col-md-4">
								<label for="price" class="form-label">每股價格</label>
								<div class="input-group has-validation">
									<input id="price" class="form-control text-end" inputmode="decimal" autocomplete="off">
									<span class="input-group-text">元</span>
									<div id="price-feedback" class="invalid-feedback"></div>
								</div>
							</div>
						</div>
						<div class="d-flex justify-content-end gap-2">
							<a th:href="@{/v2}" class="btn btn-outline-secondary">取消</a>
							<button type="submit" class="btn btn-v2"><i class="bi bi-check-lg me-1"></i>確認賣出</button>
						</div>
					</form>
				</div>
			</div>

			<div class="col-12 col-lg-4">
				<div class="v2-section">
					<div class="v2-section-header">試算</div>
					<div class="p-3 v2-calc">
						<div id="calc-empty" class="text-secondary">填好數量和價格後顯示</div>
						<div id="calc-body" class="d-none">
							<div class="v2-calc-row"><span>賣出金額</span><span class="v2-num" id="calc-amount"></span></div>
							<div class="v2-calc-row"><span>− 手續費</span><span class="v2-num" id="calc-fee"></span></div>
							<div class="v2-calc-row"><span id="calc-tax-label">− 證交稅</span><span class="v2-num" id="calc-tax"></span></div>
							<div class="v2-calc-row"><span>− 這次賣出分攤的成本</span><span class="v2-num" id="calc-cost"></span></div>
							<div class="v2-calc-row v2-calc-total"><span>已實現損益</span><span class="v2-num" id="calc-pnl"></span></div>
							<div class="v2-calc-row text-secondary mt-3"><span>賣出後剩下</span><span class="v2-num" id="calc-left"></span></div>
							<div class="small text-secondary mt-2">平均成本法：賣出不會改變剩下股票的平均成本。試算以目前持股計算，補登過去日期時以伺服器重算為準</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>

	<th:block th:replace="~{v2/fragments :: scripts}"></th:block>
	<script th:src="@{/js/v2-form.js}"></script>
	<script th:inline="javascript">
		window.V2_PAGE = {
			code: /*[[${holding.code}]]*/ '2330',
			name: /*[[${holding.name}]]*/ '台積電',
			held: /*[[${held}]]*/ {},
			closedDays: /*[[${closedDays}]]*/ {},
			// 債券 ETF 停徵證交稅的期間（第 7 題回報二；期限在後端設定）
			bondEtfExempt: { from: /*[[${bondEtfExemptFrom}]]*/ '2017-01-01', until: /*[[${bondEtfExemptUntil}]]*/ '2026-12-31' }
		};
	</script>
	<script>
		(function () {
			'use strict';
			const PAGE = window.V2_PAGE;
			const code = PAGE.code;
			// 持有股數與成本（BigInt、以分計）：開頁時由伺服器放進來；賣超被擋時重新讀取
			let heldShares = BigInt(PAGE.held.shares);
			let heldCostCents = V2Form.plainToCents(PAGE.held.total_cost);

			const form = document.getElementById('sell-form');
			const date = document.getElementById('date');
			const price = document.getElementById('price');
			date.value = V2Form.todayInTaipei();

			function renderHolding() {
				document.getElementById('held-shares').textContent = V2Form.withCommas(heldShares);
				document.getElementById('held-avg').textContent = heldShares > 0n
					? V2Form.formatCents(V2Form.avgCents(heldCostCents, heldShares)) : '—';
				const now = new Intl.DateTimeFormat('zh-TW', { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(new Date());
				document.getElementById('held-time').textContent = '資料時間 ' + now + '（台北時間）';
			}

			const quantity = V2Form.bindQuantity({
				input: document.getElementById('quantity'),
				unitName: 'unit',
				hint: document.getElementById('quantity-hint'),
				// 打字當下就檢查「不能超過持有」
				extraCheck: function (shares) {
					return shares > heldShares
						? '不能超過持有的 ' + V2Form.withCommas(heldShares) + ' 股' + (heldShares >= 1000n ? '（' + V2Form.sharesToLotText(heldShares) + ' 張）' : '')
						: null;
				},
				onChange: recalc
			});
			document.getElementById('quantity').addEventListener('blur', function () {
				if (this.value !== '') {
					quantity.check();
				}
			});
			V2Form.bindPrice(price, recalc);
			const dateField = V2Form.bindDate(date, PAGE.closedDays, recalc);

			function recalc() {
				const q = quantity.shares();
				const p = V2Form.parsePrice(price.value);
				const ready = !q.error && !p.error;
				document.getElementById('calc-empty').classList.toggle('d-none', ready);
				document.getElementById('calc-body').classList.toggle('d-none', !ready);
				if (!ready) {
					return;
				}
				const amount = q.shares * p.cents;
				const fee = V2Form.feeYuan(amount) * 100n;
				const taxExempt = V2Form.isBondEtfTaxExempt(code, date.value, PAGE.bondEtfExempt);
				const tax = V2Form.taxYuan(code, amount, date.value, PAGE.bondEtfExempt) * 100n;
				// 分攤成本：全部賣出 → 剩下的成本全部；否則 成本 × 賣出股數 ÷ 持有股數，四捨五入到分（和後端相同）
				const cost = q.shares === heldShares
					? heldCostCents
					: (heldCostCents * q.shares * 2n + heldShares) / (heldShares * 2n);
				const pnl = amount - fee - tax - cost;
				document.getElementById('calc-amount').textContent = V2Form.formatCents(amount);
				document.getElementById('calc-fee').textContent = V2Form.formatCents(fee);
				document.getElementById('calc-tax-label').textContent = '− 證交稅（'
					+ (taxExempt ? '債券 ETF 停徵' : code.startsWith('00') ? 'ETF 0.1%' : '0.3%') + '）';
				document.getElementById('calc-tax').textContent = V2Form.formatCents(tax);
				document.getElementById('calc-cost').textContent = V2Form.formatCents(cost);
				const pnlCell = document.getElementById('calc-pnl');
				pnlCell.textContent = (pnl > 0n ? '+' : '') + V2Form.formatCents(pnl);
				pnlCell.className = 'v2-num ' + (pnl > 0n ? 'text-profit' : pnl < 0n ? 'text-loss' : '');
				document.getElementById('calc-left').textContent = V2Form.withCommas(heldShares - q.shares) + ' 股';
			}

			document.getElementById('sell-all').addEventListener('click', function (event) {
				event.preventDefault();
				if (document.getElementById('quantity').readOnly) {
					return; // 送出中（輸入框是唯讀）不能改
				}
				quantity.setShares(heldShares); // 依目前單位填入（股：600；張：0.6）
				price.focus();
			});

			/** 重新讀取持有股數（另一個裝置可能已經賣掉一部分）：GET /api/v2/holdings/{code} */
			function reloadHolding() {
				fetch('/api/v2/holdings/' + encodeURIComponent(code), { headers: { 'Accept': 'application/json' } })
					.then(function (response) { return response.ok ? response.json() : null; })
					.then(function (holding) {
						if (!holding || holding.shares === null) {
							return; // 持股已刪除或資料異常：錯誤訊息已說明
						}
						heldShares = BigInt(holding.shares);
						heldCostCents = V2Form.plainToCents(holding.total_cost);
						renderHolding();
						quantity.check();
						recalc();
					})
					.catch(function () {
						// 讀不到就維持原本的數字；送出時伺服器仍會再檢查
					});
			}

			renderHolding();
			document.getElementById('quantity').focus();
			V2Form.bindSubmit(form, {
				validate: function () {
					const results = [
						dateField.check(),
						quantity.check(),
						(function () { const m = V2Form.parsePrice(price.value).error; V2Form.showError(price, m); return !m; })(),
						// 股數 × 價格最多 100 億元（防多打 0；朋友回饋 3）。要放在數量、價格檢查之後
						V2Form.checkAmount(quantity, document.getElementById('quantity'), price)
					];
					return results.every(Boolean);
				},
				confirm: dateField.confirmTradingDay,
				request: function () {
					return {
						method: 'POST',
						url: '/api/v2/holdings/' + encodeURIComponent(code) + '/trades',
						body: {
							side: 'SELL',
							trade_date: date.value,
							shares: Number(quantity.shares().shares),
							price: V2Form.centsToPlain(V2Form.parsePrice(price.value).cents)
						}
					};
				},
				onSuccess: function (data) {
					// 寫入後剛好被另一個裝置改成資料異常時，算不出的欄位是 null（極少見）→ 只說記錄了幾股
					const pnl = data.trade ? V2Form.plainToCents(data.trade.realized_pnl) : null;
					// 格式：動作 代號 名稱 股數（已實現損益放括號）：股數和金額分開，避免把「22 股」和「−24,761.31」看成一起
					return {
						message: '已記錄：賣出 ' + code + ' ' + (PAGE.name || '') + ' ' + V2Form.withCommas(quantity.shares().shares) + ' 股'
							+ (pnl === null ? '' : '（已實現損益 ' + (pnl > 0n ? '+' : '') + V2Form.formatCents(pnl) + ' 元）'),
						redirect: '/v2'
					};
				},
				onError: function (result) {
					if (result.error && result.error.code === 'OVERSELL') {
						reloadHolding(); // 例如手機剛賣掉一部分：顯示最新持有股數
					}
				}
			});
		})();
	</script>
</body>
</html>
