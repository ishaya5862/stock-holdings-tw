<!DOCTYPE html>
<!--
	持股記帳 2.0：賣出頁（第 6 題 C9；版面依 2026-11-20 預覽版 v2-sell.html）。
	- 從持股列點「賣出」→ /v2/sell?code=2330（只能賣目前持有的，代號不能改；0 股或資料異常由伺服器擋回總覽）
	- 股數可用「股」或「張」填，送出的 JSON 一律是股數（shares）
	- 「不能賣超」打字當下就提示，真正的把關在後端：送出時伺服器鎖住持股、用最新的交易紀錄重算。
	  手機（App 2.0）可能在這一頁打開之後先賣掉一部分 → 伺服器回 OVERSELL，這一頁重新讀取持有股數。
	- 送出：POST /api/v2/holdings/{code}/trades（side = SELL），標頭帶 Idempotency-Key
-->
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{v2/fragments :: head('賣出 ' + ${holding.code})}"></head>
<body>
	<nav th:replace="~{v2/fragments :: navbar('form')}"></nav>

	<main class="container v2-form-page py-4">
		<a th:href="@{/v2}" class="small text-decoration-none"><i class="bi bi-arrow-left"></i> 回持股總覽</a>
		<!--/* dialog 片段（D-53）：對話框打開時伺服器只回這一段（/v2/sell?code=…&dialog=1），獨立頁面也用同一段 */-->
		<div th:fragment="dialog" data-v2-form="sell">
		<h1 class="h4 mt-2 mb-3 v2-page-title v2-sell">
			賣出 <span th:text="${holding.code}">2330</span> <span th:text="${holding.name}">台積電</span>
		</h1>

		<div id="form-alert" class="d-none" role="alert"></div>
		<noscript><div class="alert alert-danger">這一頁需要啟用 JavaScript 才能送出。</div></noscript>

		<div class="row g-4">
			<div class="col-12 col-lg-8">
				<!-- 目前持有（只顯示）：灰底；被另一個裝置改過時會重新讀取 -->
				<!--/* D-56：flex-wrap → 數字太長時「平均成本」換到下一行；「資料時間」拿掉（使用者決定） */-->
				<div class="v2-info mb-3 d-flex flex-wrap align-items-center column-gap-4 row-gap-1">
					<div class="text-nowrap">持有 <strong class="fs-5" id="held-shares"></strong> 股</div>
					<div class="text-nowrap">平均成本 <strong id="held-avg"></strong> 元</div>
				</div>

				<div class="v2-section">
					<div class="v2-submit-overlay d-none" role="status" aria-live="polite">
						<div class="spinner-border mb-2"></div>
						<div>送出中，請稍候…</div>
						<div class="small text-secondary">請勿關閉或重新整理頁面</div>
					</div>
					<form id="sell-form" class="p-4" novalidate>
						<div class="row g-3 mb-3">
							<!--/* 表單三行（D-55）：代號（買進才有）→ 日期 → 數量＋價格 */-->
							<div class="col-12 col-md-6">
								<label for="date" class="form-label">賣出日期</label>
								<input id="date" type="date" class="form-control">
								<div id="date-feedback" class="invalid-feedback"></div>
								<div id="date-warning" class="form-text"></div>
							</div>
							</div>
							<div class="row g-3 mb-3">
							<div class="col-12 col-md-6">
								<label for="quantity" class="form-label d-flex">
									<span class="me-auto">數量</span>
									<a href="#" id="sell-all" class="small text-decoration-none">全部賣出</a>
								</label>
								<div class="input-group has-validation">
									<input id="quantity" class="form-control text-end" inputmode="decimal" autocomplete="off">
									<input type="radio" class="btn-check" name="unit" id="unit-share" value="share" checked>
									<label class="btn btn-outline-secondary" for="unit-share">股</label>
									<input type="radio" class="btn-check" name="unit" id="unit-lot" value="lot">
									<label class="btn btn-outline-secondary" for="unit-lot">張</label>
									<div id="quantity-feedback" class="invalid-feedback"></div>
								</div>
								<div id="quantity-hint" class="form-text"></div>
							</div>
							<div class="col-12 col-md-6">
								<label for="price" class="form-label">每股價格</label>
								<div class="input-group has-validation">
									<input id="price" class="form-control text-end" inputmode="decimal" autocomplete="off">
									<span class="input-group-text">元</span>
									<div id="price-feedback" class="invalid-feedback"></div>
								</div>
							</div>
						</div>
						<div class="d-flex justify-content-end gap-2">
							<a th:href="@{/v2}" class="btn btn-outline-secondary" data-v2-cancel>取消</a>
							<button type="submit" class="btn btn-v2"><i class="bi bi-check-lg me-1"></i>確認賣出</button>
						</div>
					</form>
				</div>
			</div>

			<div class="col-12 col-lg-4">
				<div class="v2-section">
					<div class="v2-section-header">試算</div>
					<div class="p-3 v2-calc">
						<div id="calc-empty" class="text-secondary">填好數量和價格後顯示</div>
						<div id="calc-body" class="d-none">
							<div class="v2-calc-row"><span>賣出金額</span><span class="v2-num" id="calc-amount"></span></div>
							<div class="v2-calc-row"><span>− 手續費</span><span class="v2-num" id="calc-fee"></span></div>
							<div class="v2-calc-row"><span>− 證交稅</span><span class="v2-num" id="calc-tax"></span></div>
							<div class="v2-calc-row"><span>− 這次賣出分攤的成本</span><span class="v2-num" id="calc-cost"></span></div>
							<div class="v2-calc-row v2-calc-total"><span>已實現損益</span><span class="v2-num" id="calc-pnl"></span></div>
							<div class="v2-calc-row text-secondary mt-3"><span>賣出後剩下</span><span class="v2-num" id="calc-left"></span></div>
							<!--/* 算法說明放在算式下方（D-56，和買進相同）；證交稅率依代號與賣出日期由 v2-forms.js 填入 */-->
							<div class="v2-calc-notes">
								<div>手續費：0.1425%，捨去到元，最低 20 元</div>
								<div>證交稅：<span id="calc-tax-rate">0.3%</span></div>
								<div>平均成本法：賣出不會改變剩下股票的平均成本。試算以目前持股計算，補登過去日期時以伺服器重算為準</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<!--/* 伺服器放進來的資料（JSON，理由同買進頁）；債券 ETF 停徵證交稅的期間在後端設定（第 7 題回報二） */-->
		<script type="application/json" class="v2-form-data" th:inline="javascript">
			{
				"code": /*[[${holding.code}]]*/ "2330",
				"name": /*[[${holding.name}]]*/ "台積電",
				"held": /*[[${held}]]*/ {},
				"closedDays": /*[[${closedDays}]]*/ {},
				"bondEtfExempt": { "from": /*[[${bondEtfExemptFrom}]]*/ "2017-01-01", "until": /*[[${bondEtfExemptUntil}]]*/ "2026-12-31" }
			}
		</script>
		</div>
	</main>

	<th:block th:replace="~{v2/fragments :: scripts}"></th:block>
	<script th:src="@{/js/v2-form.js}"></script>
	<!--/* 表單程式在 v2-forms.js（D-53：獨立頁面和總覽、明細的對話框共用同一份）；伺服器的資料在上面的 .v2-form-data */-->
	<script th:src="@{/js/v2-forms.js}"></script>
	<script>V2Forms.initPage();</script>
</body>
</html>
