<!DOCTYPE html>
<!--
	持股記帳 2.0 的共用版型片段（第 6 題 C8）。第一版 fragments/layout.html 不動（兩版樣式分開，C8-2 a）。
	- head(title)：<head>（Bootstrap 5、圖示、v2.css）
	- navbar(active)：頁首（Logo L2、2.0 標籤、頁籤、第一版連結、台北時間）
	- flash：伺服器轉址帶來的提示＋買賣頁成功跳回來時 JavaScript 顯示的提示（C9）
	- scripts：頁尾的 JavaScript
-->
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${title} + ' - 持股記帳 2.0'">持股記帳 2.0</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link rel="stylesheet" th:href="@{/css/v2.css}">
</head>

<body>

	<nav th:fragment="navbar(active)" class="navbar navbar-expand v2-navbar">
		<div class="container">
			<a class="navbar-brand fw-bold" th:href="@{/v2}">
				<!--/* Logo L2：帳本＋上升箭頭（內嵌 SVG，顏色跟著 v2.css 的變數；2026-11-20 使用者選定） */-->
				<svg class="v2-logo" viewBox="0 0 32 32" aria-hidden="true">
					<rect x="5" y="3" width="20" height="26" rx="3" fill="none" stroke="var(--v2-brand-text)" stroke-width="2"/>
					<line x1="10" y1="3" x2="10" y2="29" stroke="var(--v2-brand-text)" stroke-width="2"/>
					<polyline points="13,22 17,17 20,19 26,11" fill="none" stroke="var(--v2-accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
					<polyline points="22,11 26,11 26,15" fill="none" stroke="var(--v2-accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
				</svg>持股記帳<span class="v2-version">2.0</span>
			</a>
			<ul class="navbar-nav me-auto ms-4">
				<li class="nav-item">
					<a class="nav-link" th:classappend="${active == 'overview'} ? 'active'" th:href="@{/v2}">持股總覽</a>
				</li>
			</ul>
			<!--/* 第一版網頁照舊保留（C8-2 a），從這裡也能回去 */-->
			<!--/* 放在 navbar-nav 裡：頁首的連結顏色由 Bootstrap 變數決定，放在外面會變成深色字、在墨黑底上看不到 */-->
			<ul class="navbar-nav me-3">
				<li class="nav-item"><a class="nav-link small" th:href="@{/holdings}">第一版網頁</a></li>
			</ul>
			<span class="navbar-text small">
				<i class="bi bi-clock me-1"></i><span th:text="${now}">2026-11-20 09:00:00</span>（台北時間）
			</span>
		</div>
	</nav>

	<div th:fragment="flash">
		<div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="status">
			<i class="bi bi-check-circle me-1"></i><span th:text="${successMessage}">成功訊息</span>
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="關閉"></button>
		</div>
		<!--/* 換頁時的紅色提示（例如「2330 目前沒有持股…，不能賣出」）：開頭和表單的紅色錯誤框一樣加「錯誤！」（D-49） */-->
		<div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
			<i class="bi bi-exclamation-triangle me-1"></i><strong>錯誤！</strong><span th:text="${errorMessage}">錯誤訊息</span>
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="關閉"></button>
		</div>
		<!--/* 買進、賣出、修改、刪除成功後跳回來：JavaScript 從 sessionStorage 取出訊息顯示一次（v2-page.js） */-->
		<div id="v2-flash" class="alert alert-success alert-dismissible d-none" role="status">
			<i class="bi bi-check-circle me-1"></i><span id="v2-flash-text"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="關閉"></button>
		</div>
	</div>

	<!--/*
		收盤價（總覽與明細共用）：依行情狀態顯示，用字和第一版相同
		OK              → 收盤價＋日期
		UPDATING        → 更新中…（這次啟動後還沒輪到查詢）
		UNAVAILABLE     → 未取得（官方連不上）
		NO_RECENT_TRADE → 近期無成交資料（可能停止交易或已下市）
		不是 OK 時，資料庫有上次收盤價就用小字顯示（只供參考，不算進市值與損益）
	*/-->
	<th:block th:fragment="closePrice(h)" th:switch="${h.quoteStatus}">
		<th:block th:case="'OK'">
			<span th:text="${@v2Formats.money(h.closePrice)}">650.00</span>
			<div class="small text-muted" th:text="${#temporals.format(h.priceDate, 'MM/dd')}">11/20</div>
		</th:block>
		<th:block th:case="*">
			<span th:if="${h.quoteStatus == 'UPDATING'}" class="text-secondary"><i class="bi bi-arrow-repeat"></i> 更新中…</span>
			<span th:if="${h.quoteStatus == 'UNAVAILABLE'}" class="text-warning-emphasis">未取得</span>
			<span th:if="${h.quoteStatus == 'NO_RECENT_TRADE'}" class="text-danger">近期無成交資料</span>
			<div class="small text-muted" th:if="${h.lastClosePrice != null}">
				上次 <span th:text="${@v2Formats.money(h.lastClosePrice)}">640.00</span>
				（<span th:text="${#temporals.format(h.lastPriceDate, 'yyyy/MM/dd')}">2026/11/19</span>）
			</div>
		</th:block>
	</th:block>

	<!--/*
		表格的數字（優化 v2-number-display）：≥ 100 萬簡寫成「123 萬」「1,235 萬」「1.23 億」（門檻在 V2Formats，D-45），
		加 v2-abbr（底部淡虛線）、v2-tip（提示框）與 data-full（完整數字）；未滿 100 萬照舊完整顯示、沒有提示。
		提示框（D-43）：滑鼠移上去由 CSS 馬上顯示（v2.css 的 .v2-tip::after 讀 data-full）；
		手機沒有滑鼠 → 點一下顯示、再點一下或點別處收起（v2-page.js）。tabindex="0"：用鍵盤 Tab 移過去也看得到。
		不用 title：瀏覽器內建的提示要停約 1 秒才出現，而且會和 CSS 提示框重複。
		先用 th:with 算好再放進 th:attr：Thymeleaf 為了安全，不允許在屬性裡直接呼叫 Bean（同 detail.html 的 deleteText）。
		值是 null 時 Thymeleaf 會整個省略那個屬性。
	*/-->
	<span th:fragment="shortMoney(amount)"
		th:with="full=${@v2Formats.moneyTitle(amount)}"
		th:classappend="${full != null} ? 'v2-abbr v2-tip'" th:attr="data-full=${full},tabindex=${full != null ? 0 : null}"
		th:text="${@v2Formats.shortMoney(amount)}">1,235 萬</span>

	<span th:fragment="shortSignedMoney(amount)"
		th:with="full=${@v2Formats.signedMoneyTitle(amount)}"
		th:classappend="${full != null} ? 'v2-abbr v2-tip'" th:attr="data-full=${full},tabindex=${full != null ? 0 : null}"
		th:text="${@v2Formats.shortSignedMoney(amount)}">+1,235 萬</span>

	<span th:fragment="shortShares(shares)"
		th:with="full=${@v2Formats.sharesTitle(shares)}"
		th:classappend="${full != null} ? 'v2-abbr v2-tip'" th:attr="data-full=${full},tabindex=${full != null ? 0 : null}"
		th:text="${@v2Formats.shortShares(shares)}">1,235 萬股</span>

	<!--/*
		摘要卡的金額（D-41、D-43、D-44）：顯示完整金額（不簡寫）；≥ 100 萬時加同樣的提示框（v2-tip），內容是「約 1,202 萬元」。
		不加虛線（v2-abbr）：卡片是完整金額不是簡寫，使用者決定拿掉。
	*/-->
	<span th:fragment="cardMoney(amount)"
		th:with="approx=${@v2Formats.approxMoney(amount)}"
		th:classappend="${approx != null} ? 'v2-tip'" th:attr="data-full=${approx},tabindex=${approx != null ? 0 : null}"
		th:text="${@v2Formats.money(amount)}">12,017,100.00</span>

	<span th:fragment="cardSignedMoney(amount)"
		th:with="approx=${@v2Formats.approxSignedMoney(amount)}"
		th:classappend="${approx != null} ? 'v2-tip'" th:attr="data-full=${approx},tabindex=${approx != null ? 0 : null}"
		th:text="${@v2Formats.signedMoney(amount)}">+925,375.00</span>

	<th:block th:fragment="scripts">
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
		<script th:src="@{/js/v2-page.js}"></script>
	</th:block>

</body>
</html>
