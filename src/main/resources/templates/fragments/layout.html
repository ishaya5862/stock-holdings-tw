<!DOCTYPE html>
<!--
	共用版型片段（Thymeleaf fragment）：每一頁用 th:replace 引用，改這裡所有頁面都會一起改。
	- head(title)：<head> 內容（CSS、標題）
	- navbar：頁首（「持股記帳」標題 + 目前台北時間）
	- flash：成功 / 錯誤提示訊息
	- scripts：頁尾的 JavaScript
-->
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${title} + ' - 持股記帳'">持股記帳</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

	<nav th:fragment="navbar" class="navbar navbar-expand navbar-dark app-navbar">
		<div class="container">
			<a class="navbar-brand fw-bold" th:href="@{/}">
				<i class="bi bi-journal-text me-1"></i>持股記帳
			</a>
			<ul class="navbar-nav me-auto">
				<li class="nav-item">
					<a class="nav-link" th:href="@{/holdings}">持股清單</a>
				</li>
			</ul>
			<span class="navbar-text small">
				<i class="bi bi-clock me-1"></i><span th:text="${now}">2026-11-20 09:00:00</span>（台北時間）
			</span>
		</div>
	</nav>

	<div th:fragment="flash">
		<div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
			<i class="bi bi-check-circle me-1"></i><span th:text="${successMessage}">成功訊息</span>
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="關閉"></button>
		</div>
		<div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
			<i class="bi bi-exclamation-triangle me-1"></i><span th:text="${errorMessage}">錯誤訊息</span>
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="關閉"></button>
		</div>
	</div>

	<th:block th:fragment="scripts">
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	</th:block>

</body>
</html>
