# 測試專用設定：放在 config/ 底下，Spring Boot 會「同時」讀取正式的 application.properties，
# 並只用這裡有寫到的設定覆蓋（若放在根目錄、同名，會整個蓋掉正式設定，app.zone 等就不見了）。
# 用 H2 記憶體資料庫（MySQL 相容模式）→ 跑 mvnw test 不需要開 Docker，Flyway 一樣會執行建表 SQL
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
# 正式設定的等鎖上限是 MySQL 語法；H2 的對應寫法（毫秒）
spring.datasource.hikari.connection-init-sql=SET LOCK_TIMEOUT 3000
spring.docker.compose.enabled=false
# 關閉背景排程：否則測試一啟動就會去連證交所、櫃買中心（題目規定測試不可連官方）
app.quote.refresh-enabled=false
# 萬一有程式誤連官方，也只會連到不存在的主機而失敗，不會真的打到證交所
app.quote.twse-base-url=http://twse.invalid
app.quote.tpex-base-url=http://tpex.invalid
app.quote.holiday-base-url=http://holiday.invalid
app.quote.holiday-api-enabled=false
