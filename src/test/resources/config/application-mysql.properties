# 只給「真的 MySQL」測試用（src/test/java/io/qiao/mysql/，@ActiveProfiles("mysql")）。
# 會先讀 config/application.properties（H2 的測試設定），再用這裡有寫到的設定覆蓋。
# 資料庫網址、帳號、密碼由 Testcontainers 的 @ServiceConnection 自動帶入，這裡不用寫。

# 測試設定把等鎖上限改成了 H2 的寫法（SET LOCK_TIMEOUT 3000），MySQL 看不懂 → 改回和正式設定相同的寫法。
# 沒有這行的話，MySQL 會用預設的 50 秒，測到的就不是正式環境的行為。
spring.datasource.hikari.connection-init-sql=SET SESSION innodb_lock_wait_timeout = 3
